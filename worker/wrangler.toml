name = "tiny-tasks-auth"
main = "src/index.js"
compatibility_date = "2026-08-18"

[vars]
SURREAL_NAMESPACE = "lorawan"
SURREAL_DATABASE = "ray"
SURREAL_ACCESS = "google"
TOKEN_ISSUER = "tiny-tasks-auth"
TOKEN_AUDIENCE = "tiny-tasks-surrealdb"
ALLOWED_ORIGINS = "http://localhost:5173,https://norbertherbert.github.io"

# SURREAL_JWT_SECRET is deliberately absent. Add it with:
# npm run worker:secret
# GOOGLE_CLIENT_ID is deliberately absent. Add it with:
# npm run worker:google-client-id
